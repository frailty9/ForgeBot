storage:
  backend: file

server:
  addr: 127.0.0.1:8080
  read_timeout: 10s
  write_timeout: 100s
  shutdown_timeout: 15s

runtime_config_path: runtime.example.json

# Used when enabling group operations or native.welcome; no actions enabled by default.
group_store_path: ../data/group-operations.json

# Enable together with FORGEBOT_SECRET_KEY.
# secret_store_path: secrets.json

# Prefer FORGEBOT_ADMIN_TOKEN in production.
admin_token: change-me-before-exposing-the-admin-api
