storage:
  backend: file

server:
  addr: 127.0.0.1:8080
  read_timeout: 10s
  write_timeout: 100s
  shutdown_timeout: 15s

# Console (stdout) and file output are configured separately; at least one must be
# enabled. Levels: debug, info, warn, error (case-insensitive). Formats: text, json.
# FORGEBOT_LOG_LEVEL overrides both levels. Changing log settings requires a restart.
log:
  console:
    enabled: true
    level: info
    format: text
  file:
    enabled: false          # path and rotation settings are kept while disabled
    level: info
    format: json
    path: ../logs/forgebot.log
    max_size_mb: 10         # rotate when the file reaches this size
    rotate_after_days: 7    # also rotate after this many days; 0 = size only
    max_age_days: 60        # delete backups older than this; 0 = keep forever
    compress: false         # gzip rotated backups

runtime_config_path: runtime.example.json

# Used when enabling group operations or native.welcome; no actions enabled by default.
group_store_path: ../data/group-operations.json

# Enable together with secret_key (or FORGEBOT_SECRET_KEY, which takes precedence).
# secret_store_path: secrets.json
# secret_key: base64-encoded-32-byte-master-key

# Prefer FORGEBOT_ADMIN_TOKEN in production.
admin_token: change-me-before-exposing-the-admin-api
